    <path d="M19 26a5 5 0 0 0 10 0"/>
    <path d="M40 6v6M37 9h6" class="spark"/>
    <path d="M7 6v4M5 8h4" class="spark"/></g></svg>
  <text x="140" y="58" class="t">Mundo dos Achadinhoz</text>
