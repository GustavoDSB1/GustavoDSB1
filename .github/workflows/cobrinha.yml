# Gera a animação da cobrinha comendo os quadradinhos de contribuição.
# Roda a cada 12 horas, a cada push na main e quando acionado manualmente na aba Actions.
name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?palette=github-light&color_snake=#7c3aed
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#3b1f6b,#5b2bb0,#8b5cf6,#c084fc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
