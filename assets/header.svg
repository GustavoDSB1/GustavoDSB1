  <style>
    .p { animation-name: float; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-14px); opacity: 1; } }
    .blob { animation: drift 14s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .blob2 { animation-delay: -5s; } .blob3 { animation-delay: -9s; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 20px) scale(1.15); } }
    .title { font: 800 66px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
    .gl1, .gl2 { opacity: 0; }
    .gl1 { animation: g1 5s steps(1) infinite; } .gl2 { animation: g2 5s steps(1) infinite; }
    @keyframes g1 { 0%, 90%, 100% { opacity: 0; transform: none; } 91% { opacity: .8; transform: translate(-5px, -2px); } 93% { opacity: .8; transform: translate(4px, 1px); } 95% { opacity: 0; } }
    @keyframes g2 { 0%, 90%, 100% { opacity: 0; transform: none; } 92% { opacity: .8; transform: translate(5px, 2px); } 94% { opacity: .8; transform: translate(-3px, -1px); } 96% { opacity: 0; } }
    .who { font: 600 20px Consolas, 'DejaVu Sans Mono', Menlo, monospace; fill: #22d3ee; }
    .sub { font: 400 26px Consolas, 'DejaVu Sans Mono', Menlo, monospace; fill: #c4c1dd; }
    .rv, .cur { transform-box: fill-box; transform-origin: left center; }
    .cur { transform-box: view-box; transform-origin: 0 0; }
    .tags { font: 600 15px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #8f8bb0; letter-spacing: 3px; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
    
    .rv0, .cur0 { animation: t0 16s infinite; animation-delay: 0s; }
    .ph0 { animation: v0 16s infinite; animation-delay: 0s; opacity: 0; }
    .cur0 { animation-name: m0; }
    @keyframes t0 { 0% { transform: scaleX(0); animation-timing-function: steps(27); } 10% { transform: scaleX(1); } 20% { transform: scaleX(1); animation-timing-function: steps(27); } 23.75%, 100% { transform: scaleX(0); } }
    @keyframes m0 { 0% { transform: translateX(0); animation-timing-function: steps(27); } 10% { transform: translateX(421.2px); } 20% { transform: translateX(421.2px); animation-timing-function: steps(27); } 23.75%, 100% { transform: translateX(0); } }
    @keyframes v0 { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .rv1, .cur1 { animation: t1 16s infinite; animation-delay: 4s; }
    .ph1 { animation: v1 16s infinite; animation-delay: 4s; opacity: 0; }
    .cur1 { animation-name: m1; }
    @keyframes t1 { 0% { transform: scaleX(0); animation-timing-function: steps(28); } 10% { transform: scaleX(1); } 20% { transform: scaleX(1); animation-timing-function: steps(28); } 23.75%, 100% { transform: scaleX(0); } }
    @keyframes m1 { 0% { transform: translateX(0); animation-timing-function: steps(28); } 10% { transform: translateX(436.8px); } 20% { transform: translateX(436.8px); animation-timing-function: steps(28); } 23.75%, 100% { transform: translateX(0); } }
    @keyframes v1 { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .rv2, .cur2 { animation: t2 16s infinite; animation-delay: 8s; }
    .ph2 { animation: v2 16s infinite; animation-delay: 8s; opacity: 0; }
    .cur2 { animation-name: m2; }
    @keyframes t2 { 0% { transform: scaleX(0); animation-timing-function: steps(30); } 10% { transform: scaleX(1); } 20% { transform: scaleX(1); animation-timing-function: steps(30); } 23.75%, 100% { transform: scaleX(0); } }
    @keyframes m2 { 0% { transform: translateX(0); animation-timing-function: steps(30); } 10% { transform: translateX(468.0px); } 20% { transform: translateX(468.0px); animation-timing-function: steps(30); } 23.75%, 100% { transform: translateX(0); } }
    @keyframes v2 { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .rv3, .cur3 { animation: t3 16s infinite; animation-delay: 12s; }
    .ph3 { animation: v3 16s infinite; animation-delay: 12s; opacity: 0; }
    .cur3 { animation-name: m3; }
    @keyframes t3 { 0% { transform: scaleX(0); animation-timing-function: steps(31); } 10% { transform: scaleX(1); } 20% { transform: scaleX(1); animation-timing-function: steps(31); } 23.75%, 100% { transform: scaleX(0); } }
    @keyframes m3 { 0% { transform: translateX(0); animation-timing-function: steps(31); } 10% { transform: translateX(483.6px); } 20% { transform: translateX(483.6px); animation-timing-function: steps(31); } 23.75%, 100% { transform: translateX(0); } }
    @keyframes v3 { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
  </style>
